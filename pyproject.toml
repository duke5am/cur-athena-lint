[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cur-athena-lint"
version = "0.1.0"
description = "Check AWS Cost and Usage Report Athena SQL for the partition-pruning and column mistakes that inflate the bill and silently produce wrong numbers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "duke5am" }]
keywords = [
  "aws", "cur", "cost-and-usage-report", "athena", "finops", "sql",
  "sqlglot", "linter", "partition-pruning", "cost-optimisation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Quality Assurance",
]
# sqlglot is imported at module level and is not optional: every statement is
# parsed with sqlglot's real `athena` dialect, and the column allow-list check
# walks that parse tree. Without it the checker cannot run at all.
dependencies = ["sqlglot>=20"]

[project.scripts]
cur-athena-lint = "cur_athena_lint.cli:main"

[project.urls]
Homepage = "https://github.com/duke5am/cur-athena-lint"
Issues = "https://github.com/duke5am/cur-athena-lint/issues"

[tool.setuptools]
packages = ["cur_athena_lint"]
include-package-data = true

[tool.setuptools.package-data]
cur_athena_lint = ["queries/*.sql", "setup/*.sql"]
